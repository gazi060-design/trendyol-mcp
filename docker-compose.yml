services:
  trendyol-mcp:
    build: .
    container_name: trendyol-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_OAUTH_STATE_FILE: /app/data/oauth.json
    volumes:
      - oauth_data:/app/data
    ports:
      - "127.0.0.1:${MCP_PORT:-3000}:${MCP_PORT:-3000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.MCP_PORT||3000)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  oauth_data:
